<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Controlled Charge — Test Client</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; background: #111; color: #eee; }
  input, button { font-size: 16px; padding: 8px; margin: 4px 0; }
  #bombBar { height: 24px; background: #333; border-radius: 6px; overflow: hidden; margin: 8px 0; }
  #bombFill { height: 100%; background: #e74c3c; width: 100%; transition: width 0.2s linear; }
  #sessionBar { height: 12px; background: #333; border-radius: 6px; overflow: hidden; margin: 8px 0; }
  #sessionFill { height: 100%; background: #2ecc71; width: 0%; transition: width 0.2s linear; }
  .players { display: flex; gap: 8px; flex-wrap: wrap; }
  .player { padding: 6px 10px; border-radius: 6px; background: #222; }
  .player.unfocused { background: #7a1f1f; }
  #sessionTimer { font-size: 32px; font-weight: bold; font-variant-numeric: tabular-nums; }
  #bufferTimer { font-size: 16px; color: #e74c3c; }
  #log { font-size: 12px; color: #888; white-space: pre-wrap; max-height: 150px; overflow-y: auto; }
  .hidden { display: none; }
  #roomList { display: flex; flex-direction: column; gap: 6px; }
  .roomRow { display: flex; justify-content: space-between; align-items: center; background: #222; padding: 8px 12px; border-radius: 6px; }
  .roomRow button { margin: 0; }
  #roomListEmpty { color: #888; font-size: 14px; }
</style>
</head>
<body>
  <h1>Controlled Charge — Test Client</h1>

  <div id="lobby">
    <div>
      <input id="teamName" placeholder="Team name" />
      <input id="createPlayerName" placeholder="Your name" />
      <button id="createBtn">Create Bomb Defusal Team</button>
    </div>
    <div>
      <input id="roomCode" placeholder="Team code" style="text-transform:uppercase" />
      <input id="playerName" placeholder="Your name" />
      <button id="joinBtn">Join Bomb Defusal Team</button>
    </div>

    <h3>Active Bomb Defusal Teams</h3>
    <p style="color:#888; font-size:14px; margin:0 0 8px;">uses the name typed above under "Team code"</p>
    <div id="roomList"></div>
    <div id="roomListEmpty">no open bomb defusal teams right now — create one!</div>
  </div>

  <div id="game" class="hidden">
    <h2>Bomb Defusal Team: <span id="roomCodeLabel"></span> — <span id="stateLabel"></span></h2>
    <button id="startBtn">Start Session</button>

    <h3>Study timer</h3>
    <div id="sessionTimer">00:00 / 00:00</div>
    <div id="sessionBar"><div id="sessionFill"></div></div>

    <h3>Bomb danger buffer</h3>
    <div id="bombBar"><div id="bombFill"></div></div>
    <div id="bufferTimer"></div>

    <h3>Players</h3>
    <div class="players" id="players"></div>

    <h3>Your focus</h3>
    <button id="focusToggle">I'm FOCUSED (click to look away)</button>

    <h3>Leaderboard</h3>
    <ol id="leaderboard"></ol>
  </div>

  <h3>Log</h3>
  <div id="log"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
