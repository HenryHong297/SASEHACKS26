<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Controlled Charge</title>
<style>
  :root {
    --bg: #0b0d12;
    --surface: #161a22;
    --surface-2: #1e232e;
    --border: #2a3040;
    --text: #eef1f7;
    --muted: #8891a5;
    --danger: #ff4d4f;
    --danger-dim: #3a1418;
    --safe: #2ecc71;
    --accent: #ff8a3d;
    --accent-2: #ff4d4f;
  }

  * { box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
    max-width: 780px;
    margin: 0 auto;
    padding: 32px 20px 60px;
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(255, 77, 79, 0.12), transparent 60%),
      var(--bg);
    color: var(--text);
  }

  h1, h2, h3 { margin: 0 0 4px; }
  h3 { font-size: 14px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 20px 0 10px; }

  header.hero { text-align: center; margin-bottom: 28px; }
  header.hero .bomb { font-size: 40px; line-height: 1; }
  header.hero h1 {
    font-size: 28px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  header.hero p { color: var(--muted); font-size: 14px; margin: 4px 0 0; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 20px;
    margin-bottom: 16px;
  }

  .cardRow { display: flex; gap: 14px; flex-wrap: wrap; }
  .cardRow > .card { flex: 1 1 260px; }

  label.field { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  label.field:first-of-type { margin-top: 0; }

  input[type="text"], input:not([type]) {
    width: 100%;
    font-size: 15px;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
  }
  input::placeholder { color: var(--muted); }

  .checkboxRow { display: flex; align-items: center; gap: 8px; margin: 12px 0 4px; font-size: 14px; color: var(--muted); }
  .checkboxRow input { width: auto; }

  button {
    font-size: 15px;
    padding: 11px 16px;
    margin-top: 14px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    transition: transform 0.08s ease, opacity 0.15s ease;
  }
  button:active { transform: scale(0.98); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }

  button.primary { width: 100%; color: #1a1005; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
  button.secondary { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
  button.small { margin: 0; padding: 6px 12px; font-size: 13px; }

  .roomRow {
    display: flex; justify-content: space-between; align-items: center;
    background: var(--surface-2); border: 1px solid var(--border);
    padding: 10px 14px; border-radius: 10px; margin-bottom: 8px;
  }
  .roomRow .meta { font-size: 13px; color: var(--muted); }
  .roomRow .teamName { font-weight: 600; }
  #roomListEmpty { color: var(--muted); font-size: 14px; padding: 8px 2px; }

  .gameHeader { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
  .pill { display: inline-block; font-size: 12px; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); color: var(--muted); }
  .pill.state-armed { color: var(--accent); border-color: var(--accent); }
  .pill.state-defused { color: var(--safe); border-color: var(--safe); }
  .pill.state-exploded { color: var(--danger); border-color: var(--danger); }
  .pill.private { color: var(--accent-2); border-color: var(--accent-2); }

  .statBig { font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .statSub { color: var(--muted); font-size: 13px; margin-top: 2px; }

  #bombBar, #sessionBar { height: 14px; background: var(--surface-2); border-radius: 999px; overflow: hidden; margin: 10px 0 4px; }
  #bombFill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--danger)); width: 100%; transition: width 0.2s linear; }
  #sessionFill { height: 100%; background: var(--safe); width: 0%; transition: width 0.2s linear; }

  .players { display: flex; gap: 12px; flex-wrap: wrap; }
  .playerCard {
    width: 140px; display: flex; flex-direction: column; align-items: center; gap: 8px;
    background: var(--surface-2); border: 1px solid var(--border); padding: 10px; border-radius: 12px;
    transition: background 0.2s ease, border-color 0.2s ease;
  }
  .playerCard.unfocused { background: var(--danger-dim); border-color: var(--danger); }
  .cameraBox { width: 120px; height: 90px; background: #000; border-radius: 8px; display: flex; align-items: center; justify-content: center; overflow: hidden; color: #444; font-size: 26px; }
  .cameraBox video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
  .playerName { font-size: 13px; text-align: center; }

  .statRow { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
  .statRow:last-child { border-bottom: none; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; margin-left: 6px; }
  .badge.mvp { color: var(--safe); background: rgba(46, 204, 113, 0.12); }
  .badge.weak { color: var(--danger); background: rgba(255, 77, 79, 0.12); }

  #leaderboard { list-style: none; padding: 0; margin: 0; }
  #leaderboard li { background: var(--surface-2); border: 1px solid var(--border); padding: 8px 12px; border-radius: 8px; margin-bottom: 6px; font-size: 14px; }

  details.logBox { margin-top: 24px; color: var(--muted); }
  details.logBox summary { cursor: pointer; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; }
  #log { font-size: 12px; color: var(--muted); white-space: pre-wrap; max-height: 150px; overflow-y: auto; margin-top: 8px; }

  .hidden { display: none; }
</style>
</head>
<body>
  <header class="hero">
    <div class="bomb">💣</div>
    <h1>Controlled Charge</h1>
    <p>Stay focused as a team, or watch it blow up.</p>
  </header>

  <div id="lobby">
    <div class="cardRow">
      <div class="card">
        <h3>Create a Team</h3>
        <label class="field" for="teamName">Team name</label>
        <input id="teamName" placeholder="e.g. Study Squad" />
        <label class="field" for="createPlayerName">Your name</label>
        <input id="createPlayerName" placeholder="Your name" />
        <label class="checkboxRow"><input type="checkbox" id="isPrivateCheckbox" /> 🔒 Private — only joinable by code, hidden from the public list</label>
        <button class="primary" id="createBtn">Create Bomb Defusal Team</button>
      </div>

      <div class="card">
        <h3>Join a Team</h3>
        <label class="field" for="roomCode">Team code</label>
        <input id="roomCode" placeholder="Team code" style="text-transform:uppercase" />
        <label class="field" for="playerName">Your name</label>
        <input id="playerName" placeholder="Your name" />
        <button class="secondary" style="width:100%" id="joinBtn">Join Bomb Defusal Team</button>
      </div>
    </div>

    <div class="card">
      <h3>Active Public Teams</h3>
      <div id="roomList"></div>
      <div id="roomListEmpty">no open bomb defusal teams right now — create one!</div>
    </div>
  </div>

  <div id="game" class="hidden">
    <div class="card">
      <div class="gameHeader">
        <div>
          <h2><span id="roomCodeLabel"></span></h2>
          <span class="pill" id="stateLabel"></span>
          <span class="pill private hidden" id="privatePill">🔒 private</span>
        </div>
        <button class="secondary small" id="startBtn">Start Session</button>
      </div>
    </div>

    <div class="cardRow">
      <div class="card">
        <h3>Study Timer</h3>
        <div class="statBig" id="sessionTimer">00:00 / 00:00</div>
        <div id="sessionBar"><div id="sessionFill"></div></div>
      </div>
      <div class="card">
        <h3>Bomb Danger Buffer</h3>
        <div class="statBig" id="bufferTimer">—</div>
        <div class="statSub" id="bufferSub"></div>
        <div id="bombBar"><div id="bombFill"></div></div>
      </div>
    </div>

    <div class="card">
      <h3>Players</h3>
      <div class="players" id="players"></div>
    </div>

    <div class="card">
      <h3>Your Focus</h3>
      <button class="secondary" id="focusToggle">I'm FOCUSED (click to look away)</button>
    </div>

    <div id="roundSummary" class="card hidden">
      <h3>Round Summary</h3>
      <div id="statsList"></div>
    </div>

    <div class="card">
      <h3>Leaderboard</h3>
      <ol id="leaderboard" style="padding-left:0; list-style:none; margin:0;"></ol>
    </div>
  </div>

  <details class="logBox">
    <summary>Debug Log</summary>
    <div id="log"></div>
  </details>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
